version: "3.8"

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg15-alpine
    container_name: daytrade_it_timescaledb
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      # NOTE: default user/db name intentionally left as "gpt_quant" here --
      # it must match the GRANT statements in ./timescaledb/init.sql and the
      # default in docker/.env.example, neither of which this task renames.
      POSTGRES_USER: ${POSTGRES_USER:-gpt_quant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-gpt_quant}
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./timescaledb/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gpt_quant} -d ${POSTGRES_DB:-gpt_quant}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - daytrade_it_network

  redis:
    image: redis:7-alpine
    container_name: daytrade_it_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - daytrade_it_network

volumes:
  timescaledb_data:
    name: daytrade_it_timescaledb_data
  redis_data:
    name: daytrade_it_redis_data

networks:
  daytrade_it_network:
    name: daytrade_it_network
    driver: bridge
