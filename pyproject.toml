[project]
name = "krx-signal-engine"
version = "0.1.0"
description = "AI-Agent-Friendly News-Driven Algorithmic Trading System"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "GPT Quant Team" }
]
keywords = ["trading", "algorithmic-trading", "ai", "machine-learning", "finance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    # Core
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",

    # API
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "websockets>=12.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.25",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "redis>=5.0.0",
    "psycopg2-binary>=2.9.9",

    # ML
    "xgboost>=2.0.0",
    "scikit-learn>=1.4.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "mlflow>=2.10.0",
    "optuna>=3.5.0",

    # External APIs
    "httpx>=0.26.0",
    "aiohttp>=3.9.0",
    "polygon-api-client>=1.14.0",
    "krx-news-client>=0.2.0",
    "kiwoom-client>=0.3.0",

    # Utilities
    "structlog>=24.1.0",
    "typer>=0.9.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.2.0",
    "orjson>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.98.0",
    "testcontainers>=3.7.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    # 통합 테스트가 sqlite+aiosqlite 로 인메모리 DB 를 쓴다.
    "aiosqlite>=0.19.0",
    "httpx>=0.26.0",
]

[project.scripts]
gptq = "krx_signal_engine.interfaces.cli.main:app"

[project.urls]
Homepage = "https://github.com/yourusername/krx_signal_engine"
Documentation = "https://github.com/yourusername/krx_signal_engine#readme"
Repository = "https://github.com/yourusername/krx_signal_engine"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# krx-news-client isn't on PyPI -- it's a sibling repo
# (~/Documents/git/krx-news-client) already validated by Task 1/2's spikes.
# Path dependency mirrors how those spikes installed it (see
# docs/spikes/002-toss-reliability.md's "Method" section).
[tool.uv.sources]
krx-news-client = { path = "../krx-news-client" }

[tool.hatch.build.targets.wheel]
packages = ["src/krx_signal_engine"]

# 타입 검사가 켜진 적이 없던 레포다. domain·shared 는 strict 로 통과하고,
# 아래 세 계층은 미완성 코드가 152건의 오류를 낸다(없는 이름 import, 존재하지
# 않는 메서드 호출 등). 검사를 통째로 끄는 대신 계층별로 막아두고, 정리되는
# 대로 한 줄씩 지우면 된다.
[[tool.mypy.overrides]]
module = [
    "krx_signal_engine.application.*",
    "krx_signal_engine.infrastructure.*",
    "krx_signal_engine.interfaces.*",
]
ignore_errors = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
# FastAPI·MCP 의 인자는 프레임워크가 주입한다(Depends/Query/Body). 함수 본문에서
# 직접 안 쓰여도 시그니처에 있어야 하므로 ARG 는 이 계층에서 오탐이다.
"src/krx_signal_engine/interfaces/**" = ["ARG001", "ARG002"]
"src/krx_signal_engine/application/handlers/**" = ["ARG001", "ARG002"]
"tests/**" = ["ARG001", "ARG002"]

[tool.ruff.lint.isort]
known-first-party = ["krx_signal_engine"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov=src/krx_signal_engine --cov-report=term-missing"

[tool.coverage.run]
source = ["src/krx_signal_engine"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
